name: Deploy API to VPS

on:
  push:
    branches: [main]

concurrency:
  group: nexera-back-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            git -C back fetch origin
            git -C back checkout -B main origin/main
            docker compose up -d --build migrate api
            docker compose up -d
            docker compose ps
