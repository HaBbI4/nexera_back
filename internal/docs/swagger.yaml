        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/nexera_back_internal_httpresponse.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/nexera_back_internal_httpresponse.ErrorResponse'
      summary: Обновить FAQ
      tags:
      - admin-faq
  /api/v1/admin/leads:
    get:
      description: Возвращает заявки клиентов (вместе с услугой, если она указана)
        с фильтрацией по услуге, источнику и периоду создания. Требует авторизации.
      parameters:
      - description: ID услуги — вернуть только заявки на эту услугу
        in: query
        name: service_id
        type: integer
      - description: Источник заявки (например contact_form)
        in: query
        name: source
        type: string
      - description: Создана не раньше, RFC3339
        in: query
        name: created_from
        type: string
      - description: Создана не позже, RFC3339
        in: query
        name: created_to
        type: string
      - description: 'Поле сортировки: created_at (по умолчанию) или name'
        in: query
        name: sort
        type: string
      - description: 'Направление сортировки: desc (по умолчанию) или asc'
        in: query
        name: order
        type: string
      - description: Количество записей (по умолчанию 50, максимум 100)
        in: query
        name: limit
