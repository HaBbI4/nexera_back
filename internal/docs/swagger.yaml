info:
  contact:
    email: 911gtrss@gmail.com
    name: API Support
  description: |-
    API сайта-визитки: баннеры, страницы, услуги, FAQ, отзывы и заявки.
    Админ-панель управляет контентом, модерирует отзывы и пользователями telegram-бота.
  license:
    name: Proprietary
  title: Nexera Back API
  version: "1.0"
paths:
  /api/v1/admin/banners:
    get:
      description: Возвращает все баннеры, включая выключенные и находящиеся вне окна
        показа. Требует авторизации.
      parameters:
      - description: ID страницы — вернуть баннеры только этой страницы
        in: query
        name: page_id
        type: integer
      - description: true — только включенные, false — только выключенные
        in: query
        name: is_active
        type: boolean
      - description: 'Поле сортировки: position (по умолчанию) или created_at'
        in: query
        name: sort
        type: string
      - description: 'Направление сортировки: asc (по умолчанию) или desc'
        in: query
        name: order
        type: string
      - description: Количество записей (по умолчанию 50, максимум 100)
        in: query
        name: limit
        type: integer
      - description: Смещение (по умолчанию 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/nexera_back_internal_models.Banner'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/nexera_back_internal_httpresponse.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/nexera_back_internal_httpresponse.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/nexera_back_internal_httpresponse.ErrorResponse'
      summary: Список баннеров (админка)
      tags:
      - admin-banners
    post:
      consumes:
      - multipart/form-data
      description: Создает новый баннер. Картинка — либо файл (поле image), либо готовый
        URL (поле image_url). Требует авторизации.
      parameters:
      - description: ID страницы
        in: formData
        name: page_id
        required: true
        type: integer
      - description: Заголовок
        in: formData
        name: title
        required: true
        type: string
      - description: Подзаголовок
        in: formData
        name: subtitle
        type: string
      - description: Описание
        in: formData
        name: description
        type: string
      - description: Текст ссылки
        in: formData
        name: link_title
        type: string
      - description: URL ссылки
        in: formData
        name: link_url
        type: string
      - description: Файл изображения (альтернатива image_url)
        in: formData
        name: image
        type: file
      - description: Готовый URL изображения (альтернатива файлу)
        in: formData
        name: image_url
        type: string
      - description: Порядок показа
        in: formData
        name: position
        type: integer
      - description: Начало показа, RFC3339
        in: formData
        name: starts_at
        type: string
      - description: Конец показа, RFC3339
        in: formData
        name: ends_at
        type: string
      - description: Активен
        in: formData
        name: is_active
        type: boolean
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/nexera_back_internal_models.Banner'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/nexera_back_internal_httpresponse.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/nexera_back_internal_httpresponse.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/nexera_back_internal_httpresponse.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/nexera_back_internal_httpresponse.ErrorResponse'
      summary: Создать баннер
      tags:
      - admin-banners
  /api/v1/admin/banners/{id}:
    delete:
      description: Удаляет баннер по ID. Требует авторизации.
      parameters:
      - description: ID баннера
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/nexera_back_internal_httpresponse.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/nexera_back_internal_httpresponse.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/nexera_back_internal_httpresponse.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/nexera_back_internal_httpresponse.ErrorResponse'
      summary: Удалить баннер
      tags:
      - admin-banners
    get:
      description: Возвращает баннер по ID, включая выключенный и находящийся вне
        окна показа. Требует авторизации.
      parameters:
      - description: ID баннера
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nexera_back_internal_models.Banner'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/nexera_back_internal_httpresponse.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/nexera_back_internal_httpresponse.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/nexera_back_internal_httpresponse.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/nexera_back_internal_httpresponse.ErrorResponse'
      summary: Получить баннер (админка)
      tags:
      - admin-banners
    patch:
      consumes:
      - multipart/form-data
      description: Частично обновляет баннер по ID. Требует авторизации.
      parameters:
      - description: ID баннера
        in: path
        name: id
        required: true
        type: integer
      - description: ID страницы
        in: formData
        name: page_id
        type: integer
      - description: Заголовок
        in: formData
        name: title
        type: string
      - description: Подзаголовок
        in: formData
        name: subtitle
        type: string
      - description: Описание
        in: formData
        name: description
        type: string
      - description: Текст ссылки
        in: formData
        name: link_title
        type: string
      - description: URL ссылки
        in: formData
        name: link_url
        type: string
      - description: Новый файл изображения (альтернатива image_url)
        in: formData
        name: image
        type: file
      - description: Новый URL изображения (альтернатива файлу)
        in: formData
        name: image_url
        type: string
      - description: Порядок показа
        in: formData
        name: position
        type: integer
      - description: Начало показа, RFC3339
        in: formData
        name: starts_at
        type: string
      - description: Конец показа, RFC3339
        in: formData
        name: ends_at
        type: string
      - description: Активен
        in: formData
        name: is_active
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nexera_back_internal_models.Banner'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/nexera_back_internal_httpresponse.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/nexera_back_internal_httpresponse.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/nexera_back_internal_httpresponse.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/nexera_back_internal_httpresponse.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/nexera_back_internal_httpresponse.ErrorResponse'
      summary: Обновить баннер
      tags:
      - admin-banners
  /api/v1/admin/faq:
    get:
      description: Возвращает все вопросы-ответы, включая неопубликованные. Требует
        авторизации.
      parameters:
      - description: true — только опубликованные, false — только скрытые
        in: query
        name: is_published
        type: boolean
      - description: 'Поле сортировки: position (по умолчанию) или created_at'
        in: query
        name: sort
        type: string
      - description: 'Направление сортировки: asc (по умолчанию) или desc'
        in: query
        name: order
        type: string
      - description: Количество записей (по умолчанию 50, максимум 100)
        in: query
        name: limit
        type: integer
      - description: Смещение (по умолчанию 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/nexera_back_internal_models.FAQ'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/nexera_back_internal_httpresponse.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/nexera_back_internal_httpresponse.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/nexera_back_internal_httpresponse.ErrorResponse'
      summary: Список FAQ (админка)
      tags:
      - admin-faq
    post:
      consumes:
      - application/json
      description: Создает новый вопрос-ответ. Требует авторизации.
      parameters:
      - description: Данные FAQ
        in: body
        name: faq
        required: true
        schema:
          $ref: '#/definitions/nexera_back_internal_models.CreateFAQRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/nexera_back_internal_models.FAQ'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/nexera_back_internal_httpresponse.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/nexera_back_internal_httpresponse.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/nexera_back_internal_httpresponse.ErrorResponse'
      summary: Создать FAQ
      tags:
      - admin-faq
  /api/v1/admin/faq/{id}:
    delete:
      description: Удаляет вопрос-ответ по ID. Требует авторизации.
      parameters:
      - description: ID записи FAQ
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/nexera_back_internal_httpresponse.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/nexera_back_internal_httpresponse.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/nexera_back_internal_httpresponse.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/nexera_back_internal_httpresponse.ErrorResponse'
      summary: Удалить FAQ
      tags:
      - admin-faq
    get:
      description: Возвращает вопрос-ответ по ID, включая неопубликованный. Требует
        авторизации.
      parameters:
      - description: ID записи FAQ
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nexera_back_internal_models.FAQ'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/nexera_back_internal_httpresponse.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/nexera_back_internal_httpresponse.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/nexera_back_internal_httpresponse.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/nexera_back_internal_httpresponse.ErrorResponse'
      summary: Получить FAQ (админка)
      tags:
      - admin-faq
    patch:
      consumes:
      - application/json
      description: Частично обновляет вопрос-ответ по ID. Требует авторизации.
      parameters:
      - description: ID записи FAQ
        in: path
        name: id
        required: true
        type: integer
      - description: Поля для обновления
        in: body
        name: faq
        required: true
        schema:
