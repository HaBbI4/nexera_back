        до 0.1; 0, если отзывов нет) — для блока "4.8 из 5, 37 отзывов".
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nexera_back_internal_models.ReviewSummary'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/nexera_back_internal_httpresponse.ErrorResponse'
      summary: Сводка по отзывам
      tags:
      - reviews
  /api/v1/services:
    get:
      description: Возвращает опубликованные услуги с фильтрацией по цене, сортировкой
        и пагинацией. Услуги без цены ("по запросу") под ценовой фильтр не попадают,
        а при сортировке по цене всегда идут в конце.
      parameters:
      - description: Цена не меньше (включительно)
        in: query
        name: price_from
        type: integer
      - description: Цена не больше (включительно)
        in: query
        name: price_to
        type: integer
      - description: 'Поле сортировки: position (по умолчанию), price, name или created_at'
        in: query
        name: sort
        type: string
      - description: 'Направление сортировки: asc (по умолчанию) или desc'
        in: query
        name: order
        type: string
      - description: Количество записей (по умолчанию 50, максимум 100)
        in: query
        name: limit
        type: integer
      - description: Смещение (по умолчанию 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/nexera_back_internal_models.Service'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/nexera_back_internal_httpresponse.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/nexera_back_internal_httpresponse.ErrorResponse'
      summary: Список услуг
      tags:
      - services
  /api/v1/services/{id}:
    get:
      description: Возвращает услугу по ID, если она опубликована
      parameters:
      - description: ID услуги
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nexera_back_internal_models.Service'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/nexera_back_internal_httpresponse.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/nexera_back_internal_httpresponse.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/nexera_back_internal_httpresponse.ErrorResponse'
      summary: Получить услугу
      tags:
      - services
  /health:
    get:
      description: Проверяет состояние базы данных, Redis и других зависимостей
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.HealthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_handlers.HealthResponse'
      summary: Health check
      tags:
      - health
  /health/liveness:
    get:
      description: Проверяет, что процесс приложения жив
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Liveness check
      tags:
      - health
  /health/readiness:
    get:
      description: Проверяет готовность приложения обрабатывать запросы (БД и Redis
        доступны)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/nexera_back_internal_httpresponse.ErrorResponse'
      summary: Readiness check
      tags:
      - health
schemes:
- http
- https
swagger: "2.0"
